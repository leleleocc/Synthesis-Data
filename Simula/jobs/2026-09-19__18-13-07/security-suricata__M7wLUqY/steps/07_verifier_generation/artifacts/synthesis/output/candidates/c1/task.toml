schema_version = "1.4"

[task]
name = "terminaltraj/c1"
description = "Repair Suricata autotools regeneration while preserving Rust cbindgen bindings."
authors = ["terminaltraj <terminaltraj@example.com>"]
keywords = ["software", "systems", "build", "repair", "autogen", "cbindgen", "suricata", "configuration"]

[metadata]
difficulty = "hard"
category = "Software"
subcategory = "Systems"
tags = ["build", "repair", "debugging", "configuration"]
domains = ["software", "security"]
subdomains = ["systems", "network-security"]
languages = ["c", "shell"]
oracle_types = ["result", "behavior"]
expert_time_estimate_min = 240
junior_time_estimate_min = 480

[agent]
timeout_sec = 14400

[verifier]
timeout_sec = 600

[environment]
network_mode = "public"
build_timeout_sec = 900
cpus = 4
memory_mb = 8192
storage_mb = 20480
workdir = "/app"
