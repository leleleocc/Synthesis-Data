schema_version = "1.4"

[task]
name = "terminaltraj/c6"
description = "Repair the TLS app-layer decoder, rebuild Suricata, and emit a decoder event log from a TLS pcap."
authors = ["terminaltraj <terminaltraj@example.com>"]
keywords = ["security", "forensics", "tls", "ssl", "debugging", "parsing", "network-forensics", "suricata"]

[metadata]
difficulty = "hard"
category = "Security"
subcategory = "Forensics"
tags = ["network-forensics", "tcpdump", "incident-response", "troubleshooting", "parsing"]
domains = ["security", "software"]
subdomains = ["forensics", "systems"]
languages = ["c", "shell"]
oracle_types = ["behavior", "state"]
expert_time_estimate_min = 300
junior_time_estimate_min = 600

[agent]
timeout_sec = 18000

[verifier]
timeout_sec = 900

[environment]
network_mode = "public"
build_timeout_sec = 900
cpus = 4
memory_mb = 8192
storage_mb = 20480
workdir = "/app"
