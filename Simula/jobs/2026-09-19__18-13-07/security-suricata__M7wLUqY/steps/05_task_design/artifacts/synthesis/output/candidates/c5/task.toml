schema_version = "1.4"

[task]
name = "terminaltraj/c5"
description = "Decode an incident pcap with tcpdump and craft Suricata threshold controls for decoder sids."
authors = ["terminaltraj <terminaltraj@example.com>"]
keywords = ["security", "forensics", "tcpdump", "network-forensics", "incident-response", "threshold", "parsing"]

[metadata]
difficulty = "hard"
category = "Security"
subcategory = "Forensics"
tags = ["network-forensics", "tcpdump", "incident-response", "troubleshooting", "parsing"]
domains = ["security", "software"]
subdomains = ["forensics", "systems"]
languages = ["c", "shell"]
oracle_types = ["behavior", "state"]
expert_time_estimate_min = 190
junior_time_estimate_min = 380

[agent]
timeout_sec = 11400

[verifier]
timeout_sec = 300

[environment]
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"
