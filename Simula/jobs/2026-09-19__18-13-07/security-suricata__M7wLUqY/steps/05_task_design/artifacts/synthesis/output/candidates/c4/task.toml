schema_version = "1.4"

[task]
name = "terminaltraj/c4"
description = "Migrate suricata.yaml.in placeholders into a concrete offline runtime configuration."
authors = ["terminaltraj <terminaltraj@example.com>"]
keywords = ["security", "network-security", "configuration", "yaml", "pkg-config", "http", "tls", "suricata"]

[metadata]
difficulty = "hard"
category = "Security"
subcategory = "network-security"
tags = ["protocol", "http", "tls", "alerting", "log-analysis"]
domains = ["security", "software"]
subdomains = ["network-security", "forensics"]
languages = ["c", "python"]
oracle_types = ["state", "result"]
expert_time_estimate_min = 200
junior_time_estimate_min = 400

[agent]
timeout_sec = 12000

[verifier]
timeout_sec = 300

[environment]
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"
