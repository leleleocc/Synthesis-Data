schema_version = "1.4"

[task]
name = "terminaltraj/aof-replica-offset"
description = "Repair AOF rewrite so a master keeps replication ID, offset, and WAITAOF fsync offset while rewriting the append-only file."
authors = ["terminaltraj"]
keywords = ["software", "systems", "databases", "debugging", "repair", "persistence", "troubleshooting", "redis-server", "aof", "replication"]

[metadata]
difficulty = "hard"
category = "Software"
subcategory = "Databases"
tags = ["debugging", "repair", "persistence", "troubleshooting"]
domains = ["software"]
subdomains = ["systems", "databases"]
languages = ["c", "shell"]
oracle_types = ["state", "behavior"]
expert_time_estimate_min = 240
junior_time_estimate_min = 480

[agent]
timeout_sec = 14400.0

[verifier]
timeout_sec = 600.0

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
workdir = "/app"
