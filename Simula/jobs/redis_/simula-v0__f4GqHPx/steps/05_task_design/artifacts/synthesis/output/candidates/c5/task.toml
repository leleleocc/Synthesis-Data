schema_version = "1.4"

[task]
name = "terminaltraj/lru-cache-config"
description = "Configure Redis from redis.conf as a loopback LRU cache with maxmemory eviction, unix socket, and a matching live CONFIG snapshot."
authors = ["terminaltraj"]
keywords = ["software", "systems", "caching", "linux", "redis", "configuration", "cli", "redis-server"]

[metadata]
difficulty = "hard"
category = "Software"
subcategory = "Databases"
tags = ["caching", "linux", "redis", "configuration", "cli"]
domains = ["software"]
subdomains = ["systems", "databases"]
languages = ["c", "shell"]
oracle_types = ["result", "state"]
expert_time_estimate_min = 200
junior_time_estimate_min = 400

[agent]
timeout_sec = 12000.0

[verifier]
timeout_sec = 300.0

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 8192
workdir = "/app"
