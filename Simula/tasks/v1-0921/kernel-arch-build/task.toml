schema_version = "1.1"
version = "1.0"

[task]
name = "vllm/kernel-arch-build"
description = "Compile cache kernels for the host GPU arch from TORCH_CUDA_ARCH_LIST while keeping cooperative top-k gated off sm75/sm80, and reject illegal MLA head dims."

[metadata]
difficulty = "hard"
category = "ML"
subcategory = "Kernels"
tags = ["cuda", "cmake", "vllm", "pytorch"]
expert_time_estimate_min = 330
junior_time_estimate_min = 660

[agent]
timeout_sec = 7200.0
network_mode = "public"
allowed_hosts = []

[verifier]
timeout_sec = 600.0
network_mode = "no-network"
allowed_hosts = []

[environment]
build_timeout_sec = 600.0
network_mode = "public"
allowed_hosts = []
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 1
gpu_types = ["H100"]
