version = "1.0"

[task]
name = "vllm/kernels-quant-matrix"
description = "Restore Hopper 9.0 gencode and the FP8 scaled-mm quant kernel ABI in one cmake/nvcc matrix driven by the non-root launcher."

[metadata]
difficulty = "hard"
category = "ML"
subcategory = "Kernels"
tags = ["cuda", "quantization", "cuda-kernel", "gpu"]
expert_time_estimate_min = 240
junior_time_estimate_min = 500

[environment]
build_timeout_sec = 600
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 1
gpu_types = ["H100"]
network_mode = "public"
allowed_hosts = []

[agent]
timeout_sec = 7200
network_mode = "public"
allowed_hosts = []

[verifier]
timeout_sec = 600
network_mode = "no-network"
allowed_hosts = []
