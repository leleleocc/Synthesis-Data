version = "1.0"

[task]
name = "vllm/cache-tp-recover"
description = "Recover KV-cache failover pages together with tensor-parallel rank demotion after a lost TP rank and snapshot the restored engine state."

[metadata]
difficulty = "hard"
category = "ML"
subcategory = "Inference"
tags = ["caching", "distributed-systems", "model-parallelism", "concurrency", "memory-management"]
expert_time_estimate_min = 190
junior_time_estimate_min = 400

[environment]
build_timeout_sec = 600
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 1
gpu_types = ["H100"]
network_mode = "public"
allowed_hosts = []

[agent]
timeout_sec = 7200
network_mode = "public"
allowed_hosts = []

[verifier]
timeout_sec = 600
network_mode = "no-network"
allowed_hosts = []
