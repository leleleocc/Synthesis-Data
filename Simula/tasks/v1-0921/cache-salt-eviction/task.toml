schema_version = "1.1"
version = "1.0"

[task]
name = "vllm/cache-salt-eviction"
description = "Restore prefix-cache salt and LoRA isolation together with allocate_slots protection of computed prefix pages under tail-allocation failure."

[metadata]
difficulty = "hard"
category = "ML"
subcategory = "Inference"
tags = ["caching", "lora", "gpu", "memory-management"]
expert_time_estimate_min = 210
junior_time_estimate_min = 420

[agent]
timeout_sec = 7200.0
network_mode = "public"
allowed_hosts = []

[verifier]
timeout_sec = 600.0
network_mode = "no-network"
allowed_hosts = []

[environment]
build_timeout_sec = 600.0
network_mode = "public"
allowed_hosts = []
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
