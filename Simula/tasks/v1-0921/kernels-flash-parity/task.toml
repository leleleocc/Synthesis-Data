version = "1.0"

[task]
name = "vllm/kernels-flash-parity"
description = "Bring flash-attn kernel block sizes back into agreement with paged KV-cache stride permutations and emit the kernel parity table."

[metadata]
difficulty = "hard"
category = "ML"
subcategory = "Kernels"
tags = ["gpu", "cuda", "cuda-kernel", "pytorch", "performance"]
expert_time_estimate_min = 210
junior_time_estimate_min = 450

[environment]
build_timeout_sec = 600
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 1
gpu_types = ["H100"]
network_mode = "public"
allowed_hosts = []

[agent]
timeout_sec = 7200
network_mode = "public"
allowed_hosts = []

[verifier]
timeout_sec = 600
network_mode = "no-network"
allowed_hosts = []
