schema_version = "1.1"
version = "1.0"

[task]
name = "vllm/kernel-gather-dequant"
description = "Restore MLA gather_and_maybe_dequant_cache so seq_starts indexing is bound-checked and fp8 pages dequant into fp16/bf16 with the supplied scale."

[metadata]
difficulty = "hard"
category = "ML"
subcategory = "Inference"
tags = ["pytorch", "caching", "quantization"]
expert_time_estimate_min = 300
junior_time_estimate_min = 600

[agent]
timeout_sec = 7200.0
network_mode = "public"
allowed_hosts = []

[verifier]
timeout_sec = 600.0
network_mode = "no-network"
allowed_hosts = []

[environment]
build_timeout_sec = 600.0
network_mode = "public"
allowed_hosts = []
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
