version = "1.0"

[task]
name = "vllm/cache-sse-decode"
description = "Repair OpenAI SSE framing and special-token replica offsets on the streaming path and emit a round-trip decode trace."

[metadata]
difficulty = "hard"
category = "ML"
subcategory = "Inference"
tags = ["caching", "debugging", "linux", "troubleshooting"]
expert_time_estimate_min = 220
