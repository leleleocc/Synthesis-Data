allowed_hosts = []

[verifier]
timeout_sec = 600.0
network_mode = "no-network"
allowed_hosts = []

[environment]
build_timeout_sec = 600.0
network_mode = "public"
allowed_hosts = []
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
