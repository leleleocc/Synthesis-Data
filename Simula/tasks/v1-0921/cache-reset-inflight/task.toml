schema_version = "1.1"
version = "1.0"

[task]
name = "vllm/cache-reset-inflight"
description = "Restore prefix-cache reset so in-flight holders block the wipe, and a successful reset nulls every block hash before the next shared-prefix lookup."

[metadata]
difficulty = "hard"
category = "Software"
subcategory = "Systems"
tags = ["caching", "memory-management", "concurrency", "debugging"]
expert_time_estimate_min = 180
junior_time_estimate_min = 360

[agent]
timeout_sec = 7200.0
network_mode = "public"
allowed_hosts = []

[verifier]
timeout_sec = 600.0
network_mode = "no-network"
allowed_hosts = []

[environment]
build_timeout_sec = 600.0
network_mode = "public"
allowed_hosts = []
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
