schema_version = "1.4"
multi_step_reward_strategy = "mean"
artifacts = ["/synthesis/input/target_spec.json"]

[task]
name = "terminaltraj/simula-synthesis-v1"
version = "0.3.0"
description = "Generate executable Harbor tasks from a pinned repository and a target specification."
authors = [{ name = "TerminalTraj prototype" }]
keywords = ["terminaltraj", "synthesis", "repository", "verifier-generation"]

[metadata]
difficulty = "hard"
category = "agentic-data-synthesis"
tags = ["terminal", "docker", "query-generation", "verifier-generation"]

[environment]
cpus = 4
memory_mb = 8096
storage_mb = 10240
gpus = 0
workdir = "/synthesis"

[[steps]]
name = "01_repo_profile_gate"
min_reward = 1.0
artifacts = [
  "/synthesis/state/01_repo_profile_gate.json",
  "/synthesis/state/.integrity",
]

[[steps]]
name = "02_environment"
min_reward = 1.0
artifacts = [
  "/synthesis/state/01_repo_profile_gate.json",
  "/synthesis/state/02_environment.json",
  "/synthesis/state/.integrity",
  "/synthesis/output/environment",
  "/synthesis/logs/build.log",
]

[[steps]]
name = "03_simula_plan"
min_reward = 1.0
artifacts = [
  "/synthesis/state/01_repo_profile_gate.json",
  "/synthesis/state/02_environment.json",
  "/synthesis/state/03_simula_plan.json",
  "/synthesis/state/.integrity",
]

[[steps]]
name = "04_task_design"
min_reward = 1.0
artifacts = [
  "/synthesis/state/01_repo_profile_gate.json",
  "/synthesis/state/02_environment.json",
  "/synthesis/state/03_simula_plan.json",
  "/synthesis/state/04_task_design.json",
  "/synthesis/state/.integrity",
  "/synthesis/output/environment",
  "/synthesis/output/candidates",
]

[[steps]]
name = "05_verifier_and_task"
min_reward = 1.0
artifacts = [
  "/synthesis/state/01_repo_profile_gate.json",
  "/synthesis/state/02_environment.json",
  "/synthesis/state/03_simula_plan.json",
  "/synthesis/state/04_task_design.json",
  "/synthesis/state/05_verifier.json",
  "/synthesis/state/.integrity",
  "/synthesis/output/environment",
  "/synthesis/output/candidates",
]

[[steps]]
name = "06_package"
min_reward = 1.0
artifacts = [
  "/synthesis/state/01_repo_profile_gate.json",
  "/synthesis/state/02_environment.json",
  "/synthesis/state/03_simula_plan.json",
  "/synthesis/state/04_task_design.json",
  "/synthesis/state/05_verifier.json",
  "/synthesis/state/.integrity",
  "/synthesis/output/environment",
  "/synthesis/output/candidates",
  "/synthesis/output/generated_task",
]

[[steps]]
name = "07_review"
min_reward = 1.0
artifacts = [
  "/synthesis/state/01_repo_profile_gate.json",
  "/synthesis/state/02_environment.json",
  "/synthesis/state/03_simula_plan.json",
  "/synthesis/state/04_task_design.json",
  "/synthesis/state/05_verifier.json",
  "/synthesis/state/07_review.json",
  "/synthesis/state/.integrity",
  "/synthesis/output/generated_task",
]
