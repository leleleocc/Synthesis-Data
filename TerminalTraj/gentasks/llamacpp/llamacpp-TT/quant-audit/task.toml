schema_version = "1.4"

[task]
name = "terminaltraj/quant-audit"
description = "Quantize synthetic F32 tensors with ggml CPU kernels and report packed sizes plus round-trip RMSE."
authors = [{ name = "terminaltraj" }]
keywords = ["ml", "kernels", "quantization", "ggml", "benchmarking", "cpp"]

[metadata]
difficulty = "hard"
category = "ML"
subcategory = "Kernels"
expert_time_estimate_min = 220
junior_time_estimate_min = 440
tags = ["quantization", "benchmarking", "performance", "cpp", "ml"]
domains = ["ml", "software"]
subdomains = ["kernels", "inference"]
languages = ["cpp", "c", "python"]
oracle_types = ["result", "behavior"]

[agent]
timeout_sec = 13200

[verifier]
timeout_sec = 300

[environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
