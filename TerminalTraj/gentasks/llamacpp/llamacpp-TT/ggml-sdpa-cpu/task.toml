schema_version = "1.4"

[task]
name = "terminaltraj/ggml-sdpa-cpu"
description = "Build a CPU ggml scaled-dot-product attention reference that consumes a fixture and writes a packed F32 tensor plus metadata."
authors = [{ name = "terminaltraj" }]
keywords = ["ml", "kernels", "inference", "ggml", "attention", "rope", "cpp"]

[metadata]
difficulty = "hard"
category = "ML"
subcategory = "Kernels"
expert_time_estimate_min = 240
junior_time_estimate_min = 480
tags = ["ml", "inference", "cpp", "optimization", "performance"]
domains = ["ml", "software"]
subdomains = ["kernels", "inference"]
languages = ["cpp", "c", "shell"]
oracle_types = ["result", "behavior", "state"]

[agent]
timeout_sec = 14400

[verifier]
timeout_sec = 300

[environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
