schema_version = "1.4"

[task]
name = "terminaltraj/vocab-only-tok"
description = "Write a vocab-only SPM GGUF from a JSON vocabulary and tokenize prompts with libllama."
authors = [{ name = "terminaltraj" }]
keywords = ["ml", "inference", "tokenization", "llm", "gguf", "cli"]

[metadata]
difficulty = "hard"
category = "ML"
subcategory = "Inference"
expert_time_estimate_min = 250
junior_time_estimate_min = 500
tags = ["tokenization", "llm", "inference", "cli", "build"]
domains = ["ml", "software"]
subdomains = ["inference", "systems"]
languages = ["cpp", "python", "shell"]
oracle_types = ["result", "behavior", "state"]

[agent]
timeout_sec = 15000

[verifier]
timeout_sec = 300

[environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
