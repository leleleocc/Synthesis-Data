schema_version = "1.4"

[task]
name = "terminaltraj/community-id-calculator"
description = "Build a Suricata-compatible Community ID v1 calculator for IPv4 and IPv6 flows, with a CLI and a 12-flow JSONL artifact."
authors = [{ name = "terminaltraj" }]
keywords = ["community-id", "suricata", "forensics", "cli", "parsing"]

[metadata]
candidate_id = "c1"
package_slug = "community-id-calculator"
difficulty = "hard"
category = "Security"
subcategory = "Forensics"
tags = ["network-security", "networking", "protocol", "tcp", "incident-response", "forensics", "cli", "parsing"]
domains = ["security", "software"]
subdomains = ["network-security", "forensics"]
languages = ["python", "c"]
oracle_types = ["result", "behavior"]
expert_time_estimate_min = 210
junior_time_estimate_min = 420

[agent]
timeout_sec = 12600

[verifier]
timeout_sec = 300

[environment]
network_mode = "public"
build_timeout_sec = 600
cpus = 4
memory_mb = 8192
storage_mb = 10240
workdir = "/app"
