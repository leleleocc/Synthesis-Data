schema_version = "1.4"

[task]
name = "terminaltraj/schema-gbnf"
description = "Compile JSON Schema files to GBNF with llama.cpp's in-tree converter and verify each grammar parses."
authors = ["terminaltraj"]
keywords = ["ml", "inference", "serving", "gbnf", "grammar", "cpp"]

[metadata]
difficulty = "hard"
category = "ML"
subcategory = "Inference"
expert_time_estimate_min = 200
junior_time_estimate_min = 400
tags = ["cli", "serving", "transformers", "cpp", "testing"]
domains = ["ml", "software"]
subdomains = ["inference", "systems"]
languages = ["cpp", "shell"]
oracle_types = ["result", "behavior"]

[agent]
timeout_sec = 12000

[verifier]
timeout_sec = 300

[environment]
network_mode = "public"
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 16384
workdir = "/app"
