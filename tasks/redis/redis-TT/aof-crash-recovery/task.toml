description = "Repair a crashed Redis 7 multi-part AOF, reload the catalog, and leave the instance serving the recovered keyspace."
authors = [{ name = "terminaltraj" }]
keywords = ["software", "databases", "redis", "persistence", "aof", "repair", "configuration", "redis-check-aof"]

[metadata]
candidate_id = "c1"
package_slug = "aof-crash-recovery"
difficulty = "hard"
category = "Software"
subcategory = "Databases"
tags = ["debugging", "repair", "configuration", "persistence", "redis"]
domains = ["software"]
subdomains = ["systems", "databases"]
languages = ["c", "shell"]
oracle_types = ["result", "state", "behavior"]
expert_time_estimate_min = 240
junior_time_estimate_min = 480

[agent]
timeout_sec = 14400

[verifier]
timeout_sec = 300

[environment]
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 8192
workdir = "/app"
