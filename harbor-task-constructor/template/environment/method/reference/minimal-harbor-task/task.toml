schema_version = "1.3"

[task]
name = "reference/minimal-ready-file"
version = "1.0.0"
description = "Create one exact answer file."
authors = []
keywords = ["reference", "rewardkit"]

[metadata]
difficulty = "easy"
category = "software-engineering"
tags = ["minimal"]

[verifier]
timeout_sec = 600.0
collect = []
environment_mode = "separate"

[verifier.env]
# FIXED: the known-good task maps independent judge credentials into Claude Code's names.
ANTHROPIC_BASE_URL = "${HARBOR_JUDGE_BASE_URL}"
ANTHROPIC_AUTH_TOKEN = "${HARBOR_JUDGE_AUTH_TOKEN}"

[agent]
# FIXED: the minimal reference gives an agent the measured one-hour task window.
timeout_sec = 3600.0

[environment]
# FIXED: the minimal reference uses one public baseline for environment, agent, and verifier.
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
mcp_servers = []

[solution.env]

[[artifacts]]
source = "/workspace"
